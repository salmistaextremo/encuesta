<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · Encuesta</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">⚙️ Panel Admin</div>
    <a href="/results" style="color:var(--muted);text-decoration:none;font-size:13px">Ver resultados</a>
  </header>

  <div class="admin-wrap">
    <div id="loginPanel" class="panel">
      <h3>🔐 Ingreso</h3>
      <input id="pass" type="password" placeholder="Contraseña de administrador" />
      <div class="row"><button class="btn primary" id="loginBtn">Entrar</button></div>
    </div>

    <div id="app" style="display:none">
      
      <!-- PANEL DE CANCIONES -->
      <div class="panel">
        <h3>🎵 Gestionar Canciones (Máx. 100)</h3>
        <p style="color:var(--muted);font-size:13px;margin-bottom:10px">
          Pega tu lista. Formato: <b>Título - Artista</b> (una por línea).
        </p>
        <textarea id="songsList" rows="10" placeholder="Canción 1 - Artista 1&#10;Canción 2 - Artista 2"></textarea>
        <div class="row">
          <button class="btn primary" id="saveSongsBtn">Guardar Canciones</button>
        </div>
        <p id="songCount" style="margin-top: 10px; font-size: 13px; color: var(--muted);"></p>
      </div>

      <!-- PANEL DE ENLACES -->
      <div class="panel">
        <h3>➕ Generar enlaces de votación</h3>
        <p style="color:var(--muted);font-size:13px;margin-bottom:10px">
          Escribe un nombre por línea. Los enlaces se copiarán automáticamente.
        </p>
        <textarea id="names" rows="4" placeholder="Ana García&#10;Carlos Pérez"></textarea>
        <div class="row">
          <button class="btn primary" id="addBtn">Generar y copiar enlaces</button>
        </div>
      </div>

      <!-- CONFIGURACIÓN -->
      <div class="panel">
        <h3>⏰ Configuración</h3>
        <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Fecha límite</label>
        <input id="deadline" type="datetime-local" />
        <label style="display:block;font-size:13px;color:var(--muted);margin:14px 0 6px">Nueva contraseña (dejar vacío para no cambiar)</label>
        <input id="newPass" type="text" placeholder="••••••••" />
        <div class="row">
          <button class="btn primary" id="saveCfg">Guardar configuración</button>
          <button class="btn ghost" id="previewBtn">👁 Previsualizar resultados</button>
          <button class="btn danger" id="resetVotes">Borrar todos los votos</button>
        </div>
      </div>

      <!-- TABLA DE VOTOS -->
      <div class="panel">
        <h3>👥 Votos recibidos <span id="voterCount" style="color:var(--muted);font-weight:400;font-size:13px"></span></h3>
        <div style="overflow:auto">
          <table class="voter-table">
            <thead><tr><th>Nombre</th><th>Fecha de voto</th><th>Estado</th></tr></thead>
            <tbody id="voterTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pass = '';

$('#loginBtn').onclick = login;
$('#pass').onkeydown = e => { if (e.key === 'Enter') login(); };

async function login() {
  pass = $('#pass').value;
  try {
    const r = await api('GET', '/api/admin/voters');
    if (!r || r.error) return alert('Contraseña incorrecta');
    localStorage.setItem('adminPass', pass);
    $('#loginPanel').style.display = 'none';
    $('#app').style.display = 'block';
    loadData(r);
    loadSongs(); // Cargar canciones al entrar
  } catch (e) {
    alert('Contraseña incorrecta o error de red.');
  }
}

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-pass': pass },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) throw new Error('auth');
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}

// --- LÓGICA DE CANCIONES ---
async function loadSongs() {
  try {
    const r = await api('GET', '/api/admin/songs');
    if (r && r.songs) {
      $('#songsList').value = r.songs.map(s => `${s.title} - ${s.artist}`).join('\n');
      $('#songCount').textContent = `Total: ${r.songs.length} canciones actuales.`;
    }
  } catch (e) { console.error(e); }
}

$('#saveSongsBtn').onclick = async () => {
  const text = $('#songsList').value;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  
  if (lines.length === 0) return alert('No hay canciones escritas.');
  if (lines.length > 100) return alert('⚠️ El límite es de 100 canciones. Tienes ' + lines.length);

  const songs = lines.map(line => {
    const parts = line.split('-');
    const title = parts[0].trim();
    const artist = parts.slice(1).join('-').trim() || 'Desconocido';
    return { title, artist };
  });

  try {
    await api('POST', '/api/admin/songs', { songs });
    alert('✅ Canciones guardadas con éxito.');
    loadSongs();
  } catch (e) {
    alert('Error al guardar: ' + e.message);
  }
};

// --- LÓGICA DE VOTANTES Y CONFIGURACIÓN ---
function loadData({ deadline, voters }) {
  const safeVoters = voters || [];
  const dl = new Date(deadline || Date.now() + 7 * 24 * 3600 * 1000);
  const tz = new Date(dl.getTime() - dl.getTimezoneOffset() * 60000).toISOString().slice(0,16);
  $('#deadline').value = tz;

  $('#voterCount').textContent = `(${safeVoters.length} votaron)`;
  
  $('#voterTable').innerHTML = safeVoters.map(v => `
    <tr>
      <td>${esc(v.name)}</td>
      <td>${v.votedAt ? new Date(v.votedAt).toLocaleString() : '---'}</td>
      <td><span class="pill yes">✓ Votó</span></td>
    </tr>
  `).join('');
}

$('#addBtn').onclick = () => {
  const names = $('#names').value.split(/\n|,/).map(s => s.trim()).filter(Boolean);
  if (!names.length) return alert('Escribe al menos un nombre');
  
  const baseUrl = window.location.origin;
  const links = [];
  const tableRows = [];
  
  names.forEach(name => {
    const token = Math.random().toString(36).substring(2, 12);
    const link = `${baseUrl}/v/${token}?name=${encodeURIComponent(name)}`;
    links.push(link);
    tableRows.push(`
      <tr>
        <td>${esc(name)}</td>
        <td><a href="${link}" target="_blank" style="color:var(--accent-2);font-size:12px">${link}</a></td>
        <td><span class="pill no">Pendiente</span></td>
      </tr>
    `);
  });
  
  $('#voterTable').innerHTML = tableRows.join('');
  navigator.clipboard.writeText(links.join('\n'));
  alert('✅ Enlaces generados y copiados al portapapeles.');
  $('#names').value = '';
};

$('#saveCfg').onclick = async () => {
  const deadline = new Date($('#deadline').value).toISOString();
  const adminPassword = $('#newPass').value.trim() || undefined;
  await api('POST', '/api/admin/config', { deadline, adminPassword });
  if (adminPassword) pass = adminPassword;
  $('#newPass').value = '';
  alert('✅ Configuración guardada');
};

$('#previewBtn').onclick = () => {
  window.open('/results?preview=1&pass=' + encodeURIComponent(pass), '_blank');
};

$('#resetVotes').onclick = async () => {
  if (!confirm('⚠️ Se borrarán TODOS los votos. ¿Continuar?')) return;
  await api('POST', '/api/admin/reset-votes');
  loadData(await api('GET', '/api/admin/voters'));
  alert('✅ Votos borrados');
};

window.addEventListener('DOMContentLoaded', () => {
  const savedPass = localStorage.getItem('adminPass');
  if (savedPass) {
    $('#pass').value = savedPass;
    login();
  }
});
</script>
</body>
</html>
